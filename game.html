<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost Dash — a tiny browser game built from one prompt</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #191419; height: 100%; overflow: hidden; }
  #wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
  canvas { background: #191419; border: 3px solid #c41c83; border-radius: 12px; box-shadow: 0 0 40px rgba(196,28,131,.45); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<script>
'use strict';
// Ghost Dash — a tiny browser game built from ONE prompt:
// "Make a tiny browser game: a ghost collects coins and dodges spikes."
// Steer with arrow keys or WASD. Grab gold coins, dodge the red spikes.
// 3 lives, 60 seconds on the clock. Press R to restart.
// ?autoplay=1 runs a demo bot so the game plays itself.
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 960, H = 540;
const DEMO = new URLSearchParams(location.search).has('autoplay');

const hero = { x: 120, y: 270, vx: 0, vy: 0, r: 26 };
const pressed = {};
let coins = [], spikes = [], sparks = [];
let score = 0, lives = 3, timeLeft = 60, finished = false, shield = 0, elapsed = 0;
let coinClock = 0, spikeClock = 0, wobble = 0;
let paused = false, best = 0;

function between(a, b) { return a + Math.random() * (b - a); }
function addCoin() {
  coins.push({ x: between(60, W - 60), y: between(60, H - 60), r: 13, phase: between(0, 6.28) });
}
function addSpike() {
  const left = Math.random() < 0.5;
  spikes.push({ x: left ? -30 : W + 30, y: between(50, H - 50), vx: (left ? 1 : -1) * between(90, 170), r: 18, spin: between(0, 6.28) });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    sparks.push({ x, y, vx: between(-160, 160), vy: between(-160, 160), life: between(0.3, 0.7), color, r: between(2, 5) });
  }
}
function startOver() {
  hero.x = 120; hero.y = 270; hero.vx = 0; hero.vy = 0;
  coins = []; spikes = []; sparks = [];
  score = 0; lives = 3; timeLeft = 60; finished = false; shield = 0; elapsed = 0;
  for (let i = 0; i < 4; i++) addCoin();
  addSpike();
}

function paintGhost(x, y, r, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#c41c83';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x, y, r, Math.PI, 0);
  ctx.lineTo(x + r, y + r * 0.9);
  for (let i = 0; i < 3; i++) {
    const cx = x + r - (i + 0.5) * (2 * r / 3);
    ctx.quadraticCurveTo(cx + r / 6, y + r * 0.55, cx, y + r * 0.9);
    ctx.quadraticCurveTo(cx - r / 6, y + r * 0.55, x + r - (i + 1) * (2 * r / 3), y + r * 0.9);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // eyes
  ctx.fillStyle = '#191419';
  ctx.beginPath(); ctx.ellipse(x - r * 0.35, y - r * 0.15, r * 0.16, r * 0.24, 0, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + r * 0.35, y - r * 0.15, r * 0.16, r * 0.24, 0, 0, 6.29); ctx.fill();
  // blush
  ctx.fillStyle = 'rgba(196,28,131,.55)';
  ctx.beginPath(); ctx.ellipse(x - r * 0.55, y + r * 0.25, r * 0.14, r * 0.09, 0, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + r * 0.55, y + r * 0.25, r * 0.14, r * 0.09, 0, 0, 6.29); ctx.fill();
  ctx.restore();
}

function paintCoin(c) {
  const y = c.y + Math.sin(elapsed * 3 + c.phase) * 4;
  ctx.save();
  ctx.fillStyle = '#ffd34d';
  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(c.x, y, c.r, 0, 6.29); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b8860b';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('$', c.x, y + 1);
  ctx.restore();
}

function paintSpike(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.spin + elapsed * 0.6);
  ctx.fillStyle = '#ff3b30';
  ctx.strokeStyle = '#7a0d08';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * (Math.PI * 2 / 3);
    const px = Math.cos(a) * s.r, py = Math.sin(a) * s.r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7a0d08';
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, 6.29); ctx.fill();
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);
  // starfield dots
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  for (let i = 0; i < 40; i++) {
    ctx.fillRect((i * 173) % W, (i * 97) % H, 2, 2);
  }
  coins.forEach(paintCoin);
  spikes.forEach(paintSpike);
  sparks.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life * 1.6);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
  });
  ctx.globalAlpha = 1;
  const flicker = shield > 0 && Math.floor(elapsed * 12) % 2 === 0;
  paintGhost(hero.x, hero.y + Math.sin(wobble) * 3, hero.r, flicker ? 0.35 : 1);
  // HUD
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('SCORE ' + score, 18, 36);
  ctx.fillStyle = '#ff5fa2';
  ctx.fillText('♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives)), 18, 66);
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'right';
  ctx.fillText('TIME ' + Math.ceil(timeLeft) + 's', W - 18, 36);
  ctx.textAlign = 'center';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = '#c41c83';
  ctx.fillText('GHOST DASH', W / 2, 36);
  if (!finished && !DEMO) {
    ctx.font = '14px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.fillText('Arrows / WASD to move · P to pause · R to restart', W / 2, H - 14);
  }
  if (DEMO) {
    ctx.font = 'bold 14px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText('DEMO — autopilot playing', W / 2, H - 14);
  }
  if (finished) {
    ctx.fillStyle = 'rgba(25,20,25,.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 54px sans-serif';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
    ctx.fillStyle = '#ffd34d';
    ctx.font = 'bold 30px sans-serif';
    ctx.fillText('Score: ' + score, W / 2, H / 2 + 30);
    ctx.fillStyle = '#ffffff';
    ctx.font = '20px sans-serif';
    ctx.fillText('Best this session: ' + best, W / 2, H / 2 + 62);
    ctx.fillText('Press R to play again', W / 2, H / 2 + 96);
  }
  if (paused && !finished) {
    ctx.fillStyle = 'rgba(25,20,25,.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 44px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = '20px sans-serif';
    ctx.fillText('Press P to resume', W / 2, H / 2 + 40);
  }
}

function demoBot(dt) {
  // chase the nearest coin, swerve away from a spike that gets close
  let target = null, best = Infinity;
  for (const c of coins) {
    const d = (c.x - hero.x) ** 2 + (c.y - hero.y) ** 2;
    if (d < best) { best = d; target = c; }
  }
  let ax = 0, ay = 0;
  if (target) {
    ax = Math.sign(target.x - hero.x);
    ay = Math.sign(target.y - hero.y);
  }
  for (const s of spikes) {
    const dx = s.x - hero.x, dy = s.y - hero.y;
    if (dx * dx + dy * dy < 130 * 130) {
      if (Math.abs(dy) < 60) ay = dy > 0 ? -1 : 1;
      if (Math.abs(dx) < 60) ax = dx > 0 ? -1 : 1;
    }
  }
  hero.vx += ax * 1400 * dt;
  hero.vy += ay * 1400 * dt;
}

function tick(dt) {
  elapsed += dt; wobble += dt * 4;
  if (paused) return;
  if (!finished) {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; finished = true; best = Math.max(best, score); }
    if (DEMO) demoBot(dt);
    else {
      const ax = (pressed['arrowright'] || pressed['d'] ? 1 : 0) - (pressed['arrowleft'] || pressed['a'] ? 1 : 0);
      const ay = (pressed['arrowdown'] || pressed['s'] ? 1 : 0) - (pressed['arrowup'] || pressed['w'] ? 1 : 0);
      hero.vx += ax * 1500 * dt;
      hero.vy += ay * 1500 * dt;
    }
    hero.vx *= Math.pow(0.12, dt);
    hero.vy *= Math.pow(0.12, dt);
    hero.x += hero.vx * dt;
    hero.y += hero.vy * dt;
    hero.x = Math.max(hero.r, Math.min(W - hero.r, hero.x));
    hero.y = Math.max(hero.r + 30, Math.min(H - hero.r, hero.y));
    coinClock += dt; spikeClock += dt;
    if (coinClock > 1.2) { coinClock = 0; if (coins.length < 6) addCoin(); }
    if (spikeClock > 2.2) { spikeClock = 0; if (spikes.length < 5) addSpike(); }
    if (shield > 0) shield -= dt;
    coins = coins.filter(c => {
      if (Math.hypot(c.x - hero.x, c.y - hero.y) < c.r + hero.r - 6) {
        score += 1; burst(c.x, c.y, '#ffd34d', 12); return false;
      }
      return true;
    });
    spikes = spikes.filter(s => {
      s.x += s.vx * dt;
      if (s.x < -60 || s.x > W + 60) return false;
      if (Math.hypot(s.x - hero.x, s.y - hero.y) < s.r + hero.r - 8 && shield <= 0) {
        lives -= 1; shield = 1.6; burst(hero.x, hero.y, '#ff3b30', 16);
        if (lives <= 0) { lives = 0; finished = true; best = Math.max(best, score); }
      }
      return true;
    });
  }
  sparks = sparks.filter(p => {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    return p.life > 0;
  });
}

addEventListener('keydown', e => {
  pressed[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'r' && finished) { paused = false; startOver(); }
  if (e.key.toLowerCase() === 'p' && !finished) paused = !paused;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener('keyup', e => { pressed[e.key.toLowerCase()] = false; });

startOver();
let last = performance.now();
// debug hook for the video capture: read live score/lives without scraping the HUD
window.__ghostDash = { get score() { return score; }, get lives() { return lives; }, get timeLeft() { return timeLeft; }, get over() { return finished; } };
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  tick(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
